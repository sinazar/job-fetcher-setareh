name: Fetch jobs

on:
  schedule:
    # Target: 1:31 AM Toronto every day, 30 minutes after Sina's job-fetcher so
    # the two never run at once. GitHub cron is UTC-only and ignores daylight
    # saving, so both 05:31 and 06:31 UTC are listed; the script skips whichever
    # lands before 1:00 AM Toronto (05:31 in winter = 12:31 AM EST).
    # Later slots are backups because GitHub often starts scheduled runs hours
    # late; only the first run of the day does any work (guard in main()).
    # The Claude digest (about 9:45 AM Toronto) reads the last 3 days of
    # data/daily files, so even a very late run is picked up the next morning.
    - cron: "31 5 * * *"
    - cron: "31 6 * * *"
    - cron: "47 7 * * *"
    - cron: "53 9 * * *"
    - cron: "11 12 * * *"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write         # needed to commit data/ back to the repo

concurrency:
  group: fetch-jobs-setareh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python fetch_jobs.py

      - name: Commit results
        run: |
          git config user.name "job-fetcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "data: daily fetch $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
